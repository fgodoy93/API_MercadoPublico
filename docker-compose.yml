version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${PORT:-3001}:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DB_HOST=${DB_HOST:-postgres}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME:-mercado_publico}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres_password}
      - DATABASE_URL=${DATABASE_URL:-}
      - DB_SSL=${DB_SSL:-false}
      - MERCADO_PUBLICO_API_KEY=${MERCADO_PUBLICO_API_KEY:-8492A92C-99C9-411F-9530-45B0A3A9C724}
      - JWT_SECRET=${JWT_SECRET:-mercadopublico_enterprise_secret_2026}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${DB_NAME:-mercado_publico}
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-postgres_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-mercado_publico}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
